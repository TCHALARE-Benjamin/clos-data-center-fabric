all:
  vars:
    ansible_connection: docker
  children:
    fabric:
      hosts:
        clab-clos-fabric-spine1:
          hostname: spine1
          asn: 65100
          router_id: 10.0.0.1
          interfaces:
            - { name: eth1, ip: "10.1.1.0/31", desc: "to-leaf1" }
            - { name: eth2, ip: "10.1.2.0/31", desc: "to-leaf2" }
            - { name: eth3, ip: "10.1.3.0/31", desc: "to-leaf3" }
          neighbors:
            - { ip: "10.1.1.1", remote_as: 65001 }
            - { ip: "10.1.2.1", remote_as: 65002 }
            - { ip: "10.1.3.1", remote_as: 65003 }
          networks:
            - "10.0.0.1/32"

        clab-clos-fabric-spine2:
          hostname: spine2
          asn: 65100
          router_id: 10.0.0.2
          interfaces:
            - { name: eth1, ip: "10.2.1.0/31", desc: "to-leaf1" }
            - { name: eth2, ip: "10.2.1.1/31", desc: "to-spine2" }
            - { name: eth3, ip: "192.168.10.1/24", desc: "to-host1" }
          neighbors:
            - { ip: "10.1.1.0", remote_as: 65100 }
            - { ip: "10.2.1.0", remote_as: 65100 }
          networks:
            - "10.0.1.1/32"
            - "192.168.10.0/24"
        clab-clos-fabric-leaf2:
          hostname: leaf2
          asn: 65002
          router_id: 10.0.1.2
          interfaces:
            - { name: eth1, ip: "10.1.2.1/31", desc: "to-spine1" }
            - { name: eth2, ip: ""10.2.2.1/31", desc: "to-spine2" }
            - { name: eth3, ip: "192.168.20.1/24", desc: "to-host2" }
          neighbors:
            - { ip: "10.1.2.0", remote_as: 65100 }
            - { ip: "10.2.2.0", remote_as: 65100 }
          networks:
            - "10.0.1.2/32"
            - "192.168.20.0/24"

        clab-clos-fabric-leaf3:
          hostname: leaf3
          asn: 65003
          router_id: 10.0.1.3
          interfaces:
            - { name: eth1, ip: "10.1.3.1/31", desc: "to-spine1" }
            - { name: eth2, ip: "10.2.3.1/31", desc: "to-spine2" }
            - { name: eth3, ip: "192.168.30.1/24", desc: "to-host3" }
          neighbors:
            - { ip: "10.1.3.0", remote_as: 65100 }
            - { ip: "10.2.3.0", remote_as: 65100 }
          networks:
            - "10.0.1.3/32"
            - "192.168.30.0/24"
