name: clos-fabric

topology:
  kinds:
    frr:
      image: quay.io/frrouting/frr:10.5.0
      binds:
        - configs/daemons:/etc/frr/daemons
    linux:
      images: nicolaka/netshoot:latest

  nodes:
    spine1:
      kind: frr
    spine2:
      kind: frr
    leaf1:
      kind: frr
    leaf2:
      kind: frr
    leaf3:
      kind: frr
    host1:
      kind: linux
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route replace default via 192.168.10.1
    host2:
      kind: linux
      exec:
        - ip addr add 192.168.30.10/24 dev eth1
        - ip route replace default via 192.168.30.1
  links:
    # Spine 1 to leaves 1-3
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    # Spine2 to leaves 1-3
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
     # Leave to hosts
    - endpoints: ["leaf1:eth3", "host1:eth1"]
    - endpoints: ["leaf2:eth3", "host2:eth1"]
    - endpoints: ["leaf3:eth3", "host3:eth1"]
